<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto RAW Sorter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .log-container { font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-slate-900 shadow-lg sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-white/20 text-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-inner">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-tight tracking-tight">Auto RAW Sorter</h1>
                    <p class="text-xs text-slate-300 font-medium uppercase tracking-wider">Smart File Processor</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col gap-4">
                <h2 class="font-bold text-lg text-slate-800 border-b border-slate-100 pb-3"><i class="fa-solid fa-folder-tree mr-2 text-blue-600"></i> Pengaturan Folder</h2>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">1. Folder Sumber (RAW Asli)</label>
                    <button id="btnSource" onclick="selectSource()" class="w-full py-3 bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold rounded-xl transition flex items-center justify-center gap-2 border border-slate-200 shadow-sm">
                        <i class="fa-regular fa-folder-open text-blue-500"></i> Pilih Folder Sumber
                    </button>
                    <p id="sourcePath" class="text-xs text-slate-500 mt-2 truncate hidden"><i class="fa-solid fa-check text-green-500 mr-1"></i> Terpilih: <span class="font-mono"></span></p>
                </div>
                <div class="h-px bg-slate-100 w-full"></div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">2. Folder Tujuan (Hasil Copy)</label>
                    <button id="btnDest" onclick="selectDest()" class="w-full py-3 bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold rounded-xl transition flex items-center justify-center gap-2 border border-slate-200 shadow-sm">
                        <i class="fa-solid fa-folder-plus text-blue-500"></i> Pilih Folder Tujuan
                    </button>
                    <p id="destPath" class="text-xs text-slate-500 mt-2 truncate hidden"><i class="fa-solid fa-check text-green-500 mr-1"></i> Terpilih: <span class="font-mono"></span></p>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col">
                <h2 class="font-bold text-lg text-slate-800 border-b border-slate-100 pb-3 mb-4"><i class="fa-solid fa-paste mr-2 text-blue-600"></i> List Foto dari Klien</h2>
                <textarea id="fileList" class="w-full flex-grow bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:ring-2 focus:ring-blue-600 outline-none transition resize-none font-mono shadow-inner" placeholder="Paste daftar nama file dari WhatsApp klien di sini..."></textarea>
            </div>
        </div>

        <button id="processBtn" onclick="processFiles()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30 mb-6 text-lg">
            <i class="fa-solid fa-bolt"></i> Mulai Sortir & Copy File
        </button>

        <div class="bg-slate-900 rounded-2xl p-6 shadow-lg overflow-hidden flex flex-col h-64 border border-slate-800">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                <h3 class="text-white font-bold text-sm"><i class="fa-solid fa-terminal mr-2 text-slate-400"></i> Proses Log</h3>
                <span id="progressText" class="text-green-400 font-bold text-sm bg-slate-800 border border-slate-700 px-3 py-1 rounded-lg">0 / 0 File Tercopy</span>
            </div>
            <div id="logOutput" class="log-container overflow-y-auto flex-grow text-xs leading-relaxed space-y-1">
                <div class="text-slate-400">Sistem siap.</div>
            </div>
        </div>
    </main>

    <script>
        let sourceHandle = null; let destHandle = null;

        async function selectSource() {
            sourceHandle = await window.showDirectoryPicker();
            document.getElementById('sourcePath').classList.remove('hidden');
            document.getElementById('sourcePath').querySelector('span').innerText = sourceHandle.name;
        }

        async function selectDest() {
            destHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            document.getElementById('destPath').classList.remove('hidden');
            document.getElementById('destPath').querySelector('span').innerText = destHandle.name;
        }

        function addLog(message, type = "info") {
            const logBox = document.getElementById('logOutput');
            const div = document.createElement('div');
            div.innerHTML = message;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // FITUR BARU: Membersihkan TextArea dari baris "sampah"
        function cleanTextarea() {
            const textarea = document.getElementById('fileList');
            const lines = textarea.value.split('\n');
            const cleanedLines = lines.filter(line => {
                const upper = line.toUpperCase();
                // Filter baris yang mengandung metadata sampah
                if (upper.startsWith('=') || upper.includes('LAYANAN') || upper.includes('KLIEN') || 
                    upper.includes('TOTAL') || upper.includes('CATATAN') || upper.includes('DICETAK') ||
                    upper.includes('LIST FOTO') || upper.includes('DIKIRIM DARI') || !line.trim()) {
                    return false;
                }
                return true;
            });
            textarea.value = cleanedLines.join('\n');
        }

        function parseClientList(rawText) {
            let list = [];
            rawText.split('\n').forEach(line => {
                let cleanName = line.replace(/^\d+[\.\-\)]\s*/, '').trim();
                const dotIndex = cleanName.lastIndexOf('.');
                if (dotIndex !== -1) cleanName = cleanName.substring(0, dotIndex);
                if (cleanName.trim()) list.push(cleanName.trim().toUpperCase());
            });
            return [...new Set(list)];
        }

        async function processFiles() {
            if (!sourceHandle || !destHandle) return alert("Pilih Folder dulu!");
            
            // 1. Bersihkan tampilan textarea
            cleanTextarea();

            // 2. Ambil list bersih
            const targetList = parseClientList(document.getElementById('fileList').value);
            
            // 3. Proses sorting
            document.getElementById('processBtn').disabled = true;
            let copiedCountRef = { count: 0 };
            let notFoundList = [...targetList];

            await searchFilesInDirectory(sourceHandle, notFoundList, copiedCountRef, targetList.length);
            
            document.getElementById('processBtn').disabled = false;
        }

        async function searchFilesInDirectory(dirHandle, notFoundList, copiedCountRef, totalTarget) {
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file') {
                    const name = entry.name.toUpperCase();
                    const baseName = name.substring(0, name.lastIndexOf('.'));
                    const listIndex = notFoundList.findIndex(t => t === baseName);
                    
                    if (listIndex !== -1 && ['.RAW', '.ARW', '.CR2', '.CR3', '.NEF', '.DNG'].some(ext => name.endsWith(ext))) {
                        const file = await entry.getFile();
                        const newFileHandle = await destHandle.getFileHandle(entry.name, { create: true });
                        const writable = await newFileHandle.createWritable();
                        await writable.write(file);
                        await writable.close();
                        copiedCountRef.count++;
                        document.getElementById('progressText').innerText = `${copiedCountRef.count} / ${totalTarget} File Tercopy`;
                        notFoundList.splice(listIndex, 1);
                    }
                } else if (entry.kind === 'directory') {
                    await searchFilesInDirectory(entry, notFoundList, copiedCountRef, totalTarget);
                }
            }
        }
    </script>
</body>
</html>
